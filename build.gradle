plugins {
    id "java"
    id "maven-publish"
    id "idea"
    id "eclipse"
    id "com.gorylenko.gradle-git-properties"
    alias(libs.plugins.spring.boot)
    // id "gatling-conventions"
    // id "code-quality-conventions"
}

group = "com.dazzle.asklepios"
version = "0.0.1-SNAPSHOT"

description = ""

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def v = System.getProperty("java.specification.version")
assert ["17", "21", "24"].contains(v) : "Unsupported Java version: ${v}"

ext {
    springProfiles = ""
    if (project.hasProperty("tls")) {
        springProfiles += ",tls"
    }
    if (project.hasProperty("e2e")) {
        springProfiles += ",e2e"
    }
    springBootVersion = "4.0.3"
    springCloudVersion = "2025.1.1"
}

repositories {
    mavenCentral()
}

if (project.hasProperty("prod")) {
    apply from: "gradle/profile_prod.gradle"
} else {
    apply from: "gradle/profile_dev.gradle"
}

if (project.hasProperty("war")) {
    apply from: "gradle/war.gradle"
}

if (project.hasProperty("zipkin")) {
    apply from: "gradle/zipkin.gradle"
}

idea {
    module {
        excludeDirs += files("node_modules")
    }
}

eclipse {
    sourceSets {
        main {
            java {
                srcDirs += ["build/generated/sources/annotationProcessor/java/main"]
            }
        }
    }
}

defaultTasks "bootRun"

springBoot {
    mainClass = "com.dazzle.asklepios.AnalyticsApp"
}

test {
    useJUnitPlatform()
    exclude "**/*IT*", "**/*IntTest*"
    failOnNoDiscoveredTests = false
    testLogging {
        events "FAILED", "SKIPPED"
    }
    jvmArgs += "-Djava.security.egd=file:/dev/./urandom -Xmx512m"
    reports.html.required = false
    testLogging.exceptionFormat "full"
}

check.dependsOn integrationTest

task testReport(type: TestReport) {
    destinationDirectory = file("$buildDir/reports/tests")
    testResults.from(test)
}

task integrationTestReport(type: TestReport) {
    destinationDirectory = file("$buildDir/reports/tests")
    testResults.from(integrationTest)
}

gitProperties {
    failOnNoGitDirectory = false
    keys = ["git.branch", "git.commit.id.abbrev", "git.commit.id.describe"]
}

tasks.withType(com.gorylenko.GenerateGitPropertiesTask).configureEach {
    outputs.doNotCacheIf("Task is always executed") { true }
}

configurations {
    providedRuntime
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")

    compileOnly platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testRuntimeOnly platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    developmentOnly platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation platform("org.testcontainers:testcontainers-bom:1.20.4")
    testRuntimeOnly platform("org.testcontainers:testcontainers-bom:1.20.4")
    implementation platform("software.amazon.awssdk:bom:2.25.40")

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    implementation "com.fasterxml.jackson.datatype:jackson-datatype-hppc"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

    testImplementation("com.tngtech.archunit:archunit-junit5-api:${archunitJunit5Version}") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
    testRuntimeOnly("com.tngtech.archunit:archunit-junit5-engine:${archunitJunit5Version}") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }

    implementation "io.micrometer:micrometer-registry-prometheus"
    implementation "jakarta.annotation:jakarta.annotation-api"
    implementation "org.apache.commons:commons-lang3"
    implementation "software.amazon.awssdk:s3"

    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"

    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework:spring-aop"
    implementation "org.aspectj:aspectjweaver"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    implementation "org.springframework.retry:spring-retry"

    implementation libs.jackson.databind.nullable
    implementation libs.springdoc.openapi.starter.webmvc.api

    implementation "org.springframework.security:spring-security-data"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-hibernate7"
    implementation "com.fasterxml.jackson.module:jackson-module-jaxb-annotations"
    implementation "org.postgresql:postgresql"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8"
    testImplementation "org.testcontainers:jdbc"
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation "org.testcontainers:testcontainers"
    implementation 'org.apache.commons:commons-csv:1.10.0'
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "com.itextpdf:html2pdf:5.0.4"
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    implementation 'com.microsoft.playwright:playwright:1.45.0'
    annotationProcessor "org.glassfish.jaxb:jaxb-runtime"
    annotationProcessor "org.hibernate.orm:hibernate-processor"
    implementation "io.github.openfeign:feign-form-spring"
    implementation "io.github.openfeign:feign-form"
    implementation "org.springframework.cloud:spring-cloud-starter-openfeign"
 }

task cleanResources(type: Delete) {
    delete "build/resources"
}

compileJava.dependsOn processResources
processResources.dependsOn bootBuildInfo

